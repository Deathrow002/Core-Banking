server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $authentication http://authentication-service:8084;
    set $accounts http://account-service:8081;
    set $customers http://customer-service:8083;
    set $transactions http://transaction-service:8082;
    set $loans http://loan-service:8086;
    set $frontend http://frontend-service:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location /api/mobile/api/v1/auth/ {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location /oauth2/ {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location /oauth/ {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location /.well-known/ {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location /connect/ {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location = /userinfo {
        proxy_pass $authentication$request_uri;
        proxy_cache off;
    }

    location /api/mobile/accounts {
        proxy_pass $accounts$request_uri;
    }

    location /api/mobile/customers {
        proxy_pass $customers$request_uri;
    }

    location /api/mobile/transactions {
        proxy_pass $transactions$request_uri;
    }

    location /api/mobile/loans {
        proxy_pass $loans$request_uri;
    }

    location = /accounts/createAccount {
        proxy_pass $accounts$request_uri;
    }

    location = /accounts/lookups {
        limit_except GET {
            deny all;
        }
        proxy_pass $accounts$request_uri;
    }

    location = /customers/search {
        proxy_pass $customers$request_uri;
    }

    location = /customers {
        limit_except POST {
            deny all;
        }
        proxy_pass $customers$request_uri;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass $frontend$request_uri;
    }
}
